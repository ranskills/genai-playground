[project]
name = "genai-playground"
version = "0.1.0"
description = "A monorepo for GenAI experiments and learning"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ipython>=9.6.0",
    "ipywidgets>=8.1.7",
    "numpy>=2.3.4",
    "openai>=2.5.0",
    "python-dotenv>=1.1.1",
    "torch==2.2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
    "pytest>=8.4.2",
]
